[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-guardian"
version = "0.1.0"
description = "Data Drift Guardian — система детекции дрейфа и контроля качества данных в продакшене (итоговый проект 4.0 Школы аналитиков данных МТС, задача №4)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.1",
    "plotly>=5.18",
    "streamlit>=1.30",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "jupyter>=1.0", "nbconvert>=7.0", "ipykernel>=6.0", "nbformat>=5.0", "markdown>=3.5"]

[project.scripts]
drift-guardian = "drift_guardian.cli:main"

[tool.setuptools.packages.find]
include = ["drift_guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
